# @package _global_
# COCO on the DAS6 cluster nodes, plus the node's results root. Selected with data=coco_cluster
# (scripts/run_cluster.sh). This file replaces data/coco.yaml, so it repeats every data key: keep them in sync
# (tests/test_configs.py checks it). The cluster-run skill keeps a shared copy (configs/MultiMAE/data/) that
# overlays this one on cluster launches.
data:
  images_dir: /local/wding/Dataset/coco/images
  annotations_dir: /local/wding/Dataset/coco/annotations   # coco_karpathy_{train,val,test}.json
  pm_dir: /local/wding/Dataset/coco/annotations/eccv_caption   # PMRP ground truth (ECCV Caption's pm_*.json); null skips PMRP
  max_text_len: 32
  limit_train: null
  limit_val: null
  limit_test: null
paths:
  res_dir: /local/wding/res/MultiMAE/coco   # strictly under the cluster profile's RESULTS_REMOTE (/local/wding/res/MultiMAE); cluster pull brings runs back to res/coco/
